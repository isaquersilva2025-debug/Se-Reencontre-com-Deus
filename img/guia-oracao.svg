    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DDBE82"/>
      <stop offset="0.5" stop-color="#C6A15B"/>
      <stop offset="1" stop-color="#A9864A"/>
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#bg)"/>
  <circle cx="300" cy="150" r="280" fill="#FFFFFF" opacity="0.035"/>
  <rect x="26" y="26" width="548" height="748" fill="none" stroke="#C6A15B" stroke-width="1.2" opacity="0.55"/>
  <rect x="38" y="38" width="524" height="724" fill="none" stroke="#C6A15B" stroke-width="0.8" opacity="0.3"/>

  <!-- mãos abertas minimalistas -->
  <g stroke="#C6A15B" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.95">
    <path d="M300 250 C300 226 312 210 330 206"/>
    <path d="M300 250 C300 226 288 210 270 206"/>
    <path d="M330 206 C342 216 348 232 346 250 C344 262 336 270 330 276"/>
    <path d="M270 206 C258 216 252 232 254 250 C256 262 264 270 270 276"/>
  </g>
  <path d="M300 176 C290 176 284 184 284 194 C284 202 290 208 300 208 C310 208 316 202 316 194 C316 184 310 176 300 176 Z" fill="none" stroke="#C6A15B" stroke-width="1.6" opacity="0.8"/>

  <!-- título -->
  <text x="300" y="356" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="58" letter-spacing="7" fill="url(#gold)">GUIA</text>
  <text x="300" y="424" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" letter-spacing="5" fill="url(#gold)">DE ORAÇÃO</text>

  <line x1="220" y1="468" x2="300" y2="468" stroke="#C6A15B" stroke-width="1" opacity="0.6"/>
  <line x1="300" y1="468" x2="380" y2="468" stroke="#C6A15B" stroke-width="1" opacity="0.6"/>
  <rect x="295" y="463" width="10" height="10" transform="rotate(45 300 468)" fill="#C6A15B" opacity="0.85"/>

  <text x="300" y="516" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="22" fill="#E8DED0">Um caminho simples para orar</text>

  <text x="300" y="690" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="5" fill="#C6A15B" opacity="0.8">BÔNUS EXCLUSIVO</text>
  <line x1="255" y1="712" x2="345" y2="712" stroke="#C6A15B" stroke-width="1" opacity="0.5"/>
