<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" aria-label="Bônus Checklist dos 21 Dias">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E463E"/>
      <stop offset="1" stop-color="#0F2622"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DDBE82"/>
      <stop offset="0.5" stop-color="#C6A15B"/>
      <stop offset="1" stop-color="#A9864A"/>
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#bg)"/>
  <circle cx="300" cy="150" r="280" fill="#FFFFFF" opacity="0.035"/>
  <rect x="26" y="26" width="548" height="748" fill="none" stroke="#C6A15B" stroke-width="1.2" opacity="0.55"/>
  <rect x="38" y="38" width="524" height="724" fill="none" stroke="#C6A15B" stroke-width="0.8" opacity="0.3"/>

  <!-- checklist minimalista -->
  <g stroke="#C6A15B" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.95">
    <rect x="268" y="170" width="64" height="64" rx="8"/>
    <path d="M284 202 L296 214 L318 188"/>
    <line x1="268" y1="258" x2="332" y2="258"/>
    <line x1="268" y1="276" x2="332" y2="276"/>
  </g>

  <!-- título -->
  <text x="300" y="348" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" letter-spacing="5" fill="url(#gold)">CHECKLIST</text>
  <text x="300" y="416" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" letter-spacing="5" fill="url(#gold)">DOS 21 DIAS</text>

  <line x1="220" y1="462" x2="300" y2="462" stroke="#C6A15B" stroke-width="1" opacity="0.6"/>
  <line x1="300" y1="462" x2="380" y2="462" stroke="#C6A15B" stroke-width="1" opacity="0.6"/>
  <rect x="295" y="457" width="10" height="10" transform="rotate(45 300 462)" fill="#C6A15B" opacity="0.85"/>

  <text x="300" y="508" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="22" fill="#E8DED0">Acompanhe cada passo da jornada</text>

  <text x="300" y="690" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="5" fill="#C6A15B" opacity="0.8">BÔNUS EXCLUSIVO</text>
  <line x1="255" y1="712" x2="345" y2="712" stroke="#C6A15B" stroke-width="1" opacity="0.5"/>
</svg>
