<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" aria-label="Capa do ebook Se Reencontre com Deus">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E463E"/>
      <stop offset="1" stop-color="#0F2622"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DDBE82"/>
      <stop offset="0.5" stop-color="#C6A15B"/>
      <stop offset="1" stop-color="#A9864A"/>
    </linearGradient>
  </defs>

  <!-- fundo -->
  <rect width="600" height="800" fill="url(#bg)"/>
  <circle cx="300" cy="150" r="280" fill="#FFFFFF" opacity="0.035"/>

  <!-- molduras finas -->
  <rect x="26" y="26" width="548" height="748" fill="none" stroke="#C6A15B" stroke-width="1.2" opacity="0.55"/>
  <rect x="38" y="38" width="524" height="724" fill="none" stroke="#C6A15B" stroke-width="0.8" opacity="0.3"/>

  <!-- cruz minimalista -->
  <g stroke="#C6A15B" stroke-width="2.4" stroke-linecap="round" opacity="0.95">
    <line x1="300" y1="118" x2="300" y2="188"/>
    <line x1="270" y1="150" x2="330" y2="150"/>
  </g>

  <!-- folhas discretas -->
  <g fill="#C6A15B" opacity="0.5">
    <path d="M205 150 C205 132 222 118 240 118 C240 136 223 150 205 150 Z"/>
    <path d="M395 150 C395 132 378 118 360 118 C360 136 377 150 395 150 Z"/>
  </g>
  <g stroke="#C6A15B" stroke-width="1.2" opacity="0.4">
    <line x1="248" y1="128" x2="262" y2="142"/>
    <line x1="352" y1="128" x2="338" y2="142"/>
  </g>

  <!-- título -->
  <text x="300" y="282" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" letter-spacing="6" fill="url(#gold)">SE REENCONTRE</text>
  <text x="300" y="352" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="60" letter-spacing="8" fill="url(#gold)">COM DEUS</text>

  <!-- divisor com diamante -->
  <line x1="220" y1="408" x2="300" y2="408" stroke="#C6A15B" stroke-width="1" opacity="0.6"/>
  <line x1="300" y1="408" x2="380" y2="408" stroke="#C6A15B" stroke-width="1" opacity="0.6"/>
  <rect x="295" y="403" width="10" height="10" transform="rotate(45 300 408)" fill="#C6A15B" opacity="0.85"/>

  <!-- subtítulo -->
  <text x="300" y="450" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="23" letter-spacing="1" fill="#E8DED0">21 dias para voltar, reencontrar</text>
  <text x="300" y="484" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="23" letter-spacing="1" fill="#E8DED0">e permanecer</text>

  <!-- versículo -->
  <text x="300" y="572" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="17" fill="#E8DED0" opacity="0.78">“E, levantando-se, foi para seu pai.”</text>
  <text x="300" y="598" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="3" fill="#C6A15B" opacity="0.7">LUCAS 15:20</text>

  <!-- rodapé -->
  <text x="300" y="690" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="5" fill="#C6A15B" opacity="0.8">UMA JORNADA GUIADA DE FÉ</text>
  <line x1="255" y1="712" x2="345" y2="712" stroke="#C6A15B" stroke-width="1" opacity="0.5"/>
</svg>
