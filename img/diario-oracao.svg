<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" aria-label="Bônus Diário de Oração">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E463E"/>
      <stop offset="1" stop-color="#0F2622"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DDBE82"/>
      <stop offset="0.5" stop-color="#C6A15B"/>
      <stop offset="1" stop-color="#A9864A"/>
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#bg)"/>
  <circle cx="300" cy="150" r="280" fill="#FFFFFF" opacity="0.035"/>
  <rect x="26" y="26" width="548" height="748" fill="none" stroke="#C6A15B" stroke-width="1.2" opacity="0.55"/>
  <rect x="38" y="38" width="524" height="724" fill="none" stroke="#C6A15B" stroke-width="0.8" opacity="0.3"/>

  <!-- livro aberto minimalista -->
  <g stroke="#C6A15B" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.95">
    <path d="M300 190 C268 168 232 166 200 178 L200 250 C232 238 268 240 300 262"/>
    <path d="M300 190 C332 168 368 166 400 178 L400 250 C368 238 332 240 300 262"/>
  </g>
  <line x1="300" y1="195" x2="300" y2="258" stroke="#C6A15B" stroke-width="1.2" opacity="0.7"/>

  <!-- título -->
  <text x="300" y="348" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="52" letter-spacing="6" fill="url(#gold)">DIÁRIO</text>
  <text x="300" y="416" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="52" letter-spacing="6" fill="url(#gold)">DE ORAÇÃO</text>

  <line x1="220" y1="462" x2="300" y2="462" stroke="#C6A15B" stroke-width="1" opacity="0.6"/>
  <line x1="300" y1="462" x2="380" y2="462" stroke="#C6A15B" stroke-width="1" opacity="0.6"/>
  <rect x="295" y="457" width="10" height="10" transform="rotate(45 300 462)" fill="#C6A15B" opacity="0.85"/>

  <text x="300" y="508" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="22" fill="#E8DED0">Para registrar seus momentos com Deus</text>

  <text x="300" y="690" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="5" fill="#C6A15B" opacity="0.8">BÔNUS EXCLUSIVO</text>
  <line x1="255" y1="712" x2="345" y2="712" stroke="#C6A15B" stroke-width="1" opacity="0.5"/>
</svg>
